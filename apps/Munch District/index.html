<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dc4a0e">
  <title>The Loaded &amp; Dessert Menu</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Step 1: select items -->
  <main id="menu-screen" class="screen">
    <header class="brand">
      <button id="qr-open" class="qr-open" type="button" aria-label="Show payment QR code">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>
          <path d="M14 14h3v3h-3zM21 14v.01M21 21h-4M21 17.5V21M14 21v-.01"/>
        </svg>
      </button>
      <h1>The Loaded &amp; Dessert <span>Menu</span></h1>
      <p>Loaded with flavour. Finished with sweetness.</p>
    </header>

    <nav id="tabs" class="tabs" role="tablist" aria-label="Menu categories"></nav>
    <section id="items" class="items" aria-live="polite"></section>

    <footer class="bar">
      <div class="bar-total">
        <span class="cart" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3h3l2.6 12.5a1.5 1.5 0 0 0 1.5 1.2h8.6a1.5 1.5 0 0 0 1.5-1.2L20.5 7H6"/>
            <circle cx="9.5" cy="20.5" r="1.4"/><circle cx="17.5" cy="20.5" r="1.4"/>
          </svg>
          <b id="cart-count">0</b>
        </span>
        <span>Total: <b id="menu-total">₹0</b></span>
      </div>
      <button id="next" class="next" type="button" disabled>Next →</button>
    </footer>
  </main>

  <!-- Step 2: scan and pay -->
  <main id="pay-screen" class="screen pay" hidden>
    <div class="pay-card">
      <p class="pay-label">Scan &amp; Pay</p>
      <p id="pay-amount" class="pay-amount"></p>
      <div id="qr" class="qr" role="img"></div>
      <p class="pay-apps">Open PhonePe, Google Pay or any UPI app and scan. The amount fills in automatically.</p>
      <p class="pay-to">Paying <b id="pay-name"></b></p>
    </div>

    <section class="summary" aria-label="Your order">
      <h2>Your order</h2>
      <ul id="summary"></ul>
      <p class="summary-total"><span>Total</span><b id="summary-total"></b></p>
    </section>

    <div class="pay-actions">
      <button id="back" class="btn-ghost" type="button">← Back</button>
      <button id="new-order" class="btn-solid" type="button">New order</button>
    </div>
  </main>

  <!-- QR popup, opened from the icon on the menu screen -->
  <dialog id="qr-popup" class="qr-popup" aria-labelledby="qr-popup-title">
    <div class="qr-popup-body">
      <button id="qr-close" class="qr-close" type="button" aria-label="Close">×</button>
      <p id="qr-popup-title" class="pay-label">Scan &amp; Pay</p>
      <p id="qr-popup-amount" class="pay-amount"></p>
      <div id="qr-popup-code" class="qr" role="img" aria-label="UPI payment QR code"></div>
      <p class="pay-to">Paying <b id="qr-popup-name"></b></p>
    </div>
  </dialog>

  <script src="vendor/qrcode.js"></script>
  <script src="app.js"></script>
</body>
</html>
